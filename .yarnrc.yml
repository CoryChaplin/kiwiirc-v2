nodeLinker: node-modules

# Set explicitly so that a .yarnrc.yml in a parent directory cannot loosen them
enableScripts: false
npmMinimalAgeGate: 1440

# irc-framework is installed from its git master (unreleased fixes since 4.14.0).
# onConflict: reset drops any repository allowed by a parent .yarnrc.yml
approvedGitRepositories:
  onConflict: reset
  value:
    - "https://github.com/kiwiirc/irc-framework.git"

packageExtensions:
  # eslint-plugin-vuejs-accessibility (a dependency of this config) has a peer dependency on globals
  "@vue/eslint-config-airbnb@*":
    dependencies:
      globals: "^13.24.0"
